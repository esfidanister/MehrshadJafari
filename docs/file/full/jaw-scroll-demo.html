<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaw Scroll Demo</title>
<style>html,body{margin:0;background:#071014;color:#dff8fb;font:16px system-ui}body{height:520vh}.stage{position:fixed;inset:0;display:grid;place-items:center}.stage canvas{width:100%;height:100%}.label{position:fixed;left:6vw;bottom:8vh;max-width:360px;z-index:2;letter-spacing:.02em}.label b{display:block;font-size:clamp(24px,4vw,52px);margin-bottom:10px}</style>
<div class="stage"><canvas id="c"></canvas></div><div class="label"><b id="title">Craniofacial anatomy</b><span id="copy">Scroll to explore the mandible, TMJ, nerve canal, implant and orthognathic fixation.</span></div>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.166.1/build/three.module.js'; import {GLTFLoader} from 'https://unpkg.com/three@0.166.1/examples/jsm/loaders/GLTFLoader.js';
const canvas=document.querySelector('#c'), scene=new THREE.Scene(); scene.background=new THREE.Color(0x071014); const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100); const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); const light=new THREE.DirectionalLight(0x9eefff,3); light.position.set(5,-6,8); scene.add(light,new THREE.AmbientLight(0x406070,1.2)); let root, cams=[]; new GLTFLoader().load('./models/jaw.glb',g=>{root=g.scene;scene.add(root);cams=g.cameras||[];}); const stops=[['Craniofacial anatomy','Scroll to explore the full educational model.'],['TMJ and maxilla','The upper jaw, zygomatic context and temporomandibular region.'],['Inferior alveolar nerve','Follow the canal and branches inside the mandible.'],['Implant anatomy','Inspect the screw, abutment and crown assembly.'],['Orthognathic fixation','Review the educational plate and screw placement.']]; function animate(){requestAnimationFrame(animate); const p=Math.max(0,Math.min(1,scrollY/(document.body.scrollHeight-innerHeight))); const i=Math.min(4,Math.floor(p*5)),t=p*5-i; if(root){root.rotation.y=p*Math.PI*.38; const a=5.5-i*.4; camera.position.lerp(new THREE.Vector3(7*Math.cos(p*2.2),-8+a*0.2,3.8+i*.12),.06); camera.lookAt(0,1.2,.9); } document.querySelector('#title').textContent=stops[i][0];document.querySelector('#copy').textContent=stops[i][1];renderer.render(scene,camera)} animate(); addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></html>
